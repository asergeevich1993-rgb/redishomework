services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${POSTRGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
  app:
    build: .
    env_file:
      - .env
    depends_on:
      - db
      - redis